<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebRTC Video Conferencing Application</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <style>
        body {
            /* General styles for the body */
            font-family: Arial, sans-serif;
            background-color: #282626;
            color: #f48989;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            /* Margin below h1 heading */
            margin-bottom: 20px;
        }

        #videoContainer {
            /* Container for video elements */
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            gap: 20px;
            width: 80%;
            max-width: 1200px;
            margin-bottom: 20px;
        }

        #localVideoContainer,
        .remoteVideoWrapper {
            /* Styling for video containers */
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 300px;
        }

        .remoteVideoWrapper {
            /* Additional styles for remote video containers */
            background-color: #fff;
            margin: 0 5px 5px 0;
        }

        video {
            /* Styling for video elements */
            width: 100%;
            height: auto;
            border-radius: 5px;
            margin-bottom: 10px;
            margin-left: 5px;
            margin-right: 5px;
            max-width: 280px;
        }
    </style>
</head>

<body>
    <h1>WebRTC Video Conferencing Application</h1>
    <div id="videoContainer">
        <div id="localVideoContainer">
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <div id="remoteVideos"></div>
    </div>

    <script src="script.js" defer></script>

</body>

</html>
